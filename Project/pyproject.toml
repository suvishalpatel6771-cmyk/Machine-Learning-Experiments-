[project]
name = "carbonwise"
version = "1.0.0"
description = "Area-level carbon emission prediction using ElasticNet regression and a Flask web application."
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "flask-cors>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.carbonwise]
seed = 42
model = "ElasticNet Regression"
output_unit = "tonnes CO2e/month"
